[package]
name = "z2p"
version = "3.8.521"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "z2p"
path = "src/main.rs"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }

[dependencies]
actix-web = "4.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }

[dependencies.sqlx]
version = "0.9.0"
default-features = false
features = ["postgres", "tls-native-tls", "macros", "uuid", "chrono", "derive", "migrate"]