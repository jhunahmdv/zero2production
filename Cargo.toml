[package]
name = "z2p"
version = "3.5.12"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "z2p"
path = "src/main.rs"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }

[dependencies]
actix-web = "4.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }